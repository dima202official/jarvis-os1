<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <title>Kady · Wohnzimmer-TV</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="bg" aria-hidden="true"></div>

  <header class="top">
    <div>
      <p class="brand">KADY</p>
      <h1>Wohnzimmer-TV</h1>
    </div>
    <button type="button" id="btnPower" class="power" title="Power" aria-label="Power">⏻</button>
  </header>

  <section class="connect panel">
    <label>
      TV-IP
      <input id="host" type="text" value="192.168.0.216" autocomplete="off" />
    </label>
    <label>
      MAC <span class="opt">(optional)</span>
      <input id="mac" type="text" placeholder="AA:BB:CC:DD:EE:FF" autocomplete="off" />
    </label>
    <div class="row">
      <button type="button" id="btnDiscover">Suchen</button>
      <button type="button" id="btnConnect" class="primary">Verbinden</button>
      <button type="button" id="btnPairStart">PIN anfordern</button>
    </div>
    <div class="pair-row">
      <input id="pin" type="text" inputmode="numeric" maxlength="6" placeholder="PIN vom TV" />
      <button type="button" id="btnPairConfirm" class="primary">Pairing</button>
    </div>
    <p id="status" class="status" role="status">Bereit — nur Heimnetz</p>
    <ul id="devices" class="devices" hidden></ul>
  </section>

  <main class="remote">
    <div class="side">
      <button type="button" data-vol="up" class="pill">＋</button>
      <span>VOL</span>
      <button type="button" data-vol="down" class="pill">－</button>
      <button type="button" data-vol="mute" class="pill mute">🔇</button>
    </div>

    <div class="pad-wrap">
      <div class="aux">
        <button type="button" data-key="menu">Menu</button>
        <button type="button" data-key="home">Home</button>
        <button type="button" data-key="back">Back</button>
      </div>
      <div class="dpad" role="group" aria-label="Richtungspad">
        <button type="button" class="dir up" data-key="up" aria-label="Hoch">▲</button>
        <button type="button" class="dir left" data-key="left" aria-label="Links">◀</button>
        <button type="button" class="ok" data-key="ok">OK</button>
        <button type="button" class="dir right" data-key="right" aria-label="Rechts">▶</button>
        <button type="button" class="dir down" data-key="down" aria-label="Runter">▼</button>
      </div>
      <div class="aux">
        <button type="button" data-source="hdmi1">HDMI1</button>
        <button type="button" data-key="info">Info</button>
      </div>
    </div>

    <div class="side">
      <button type="button" data-key="channelup" class="pill">CH＋</button>
      <span>CH</span>
      <button type="button" data-key="channeldown" class="pill">CH－</button>
    </div>
  </main>

  <section class="apps">
    <h2>Apps</h2>
    <div class="app-grid">
      <button type="button" data-app="netflix">Netflix</button>
      <button type="button" data-app="youtube">YouTube</button>
      <button type="button" data-app="amazon">Prime</button>
      <button type="button" data-app="disneyplus">Disney+</button>
    </div>
  </section>

  <footer class="foot">
    Lokal · MQTT/TLS :36669 · kein Cloud-Zugriff
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
