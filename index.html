<!DOCTYPE html>
<html lang="ru">
<head>
  <base href="/jarvis-os1/" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Сайло" />
  <meta name="theme-color" content="#071016" />
  <meta name="description" content="Сайло — Jarvis OS1. Голосовой ассистент." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png" />
  <link rel="icon" href="assets/icon-192.png" type="image/png" />
  <title>Сайло</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="top">
    <h1 class="brand">Сайло</h1>
  </header>

  <main class="stage">
    <button type="button" id="core" class="core" title="Слушать" aria-label="Слушать. Нажмите ещё раз, чтобы остановить">
      <img src="assets/jarvis-sphere.gif" alt="" width="500" height="500" draggable="false" />
      <span class="label" id="label">Слушать</span>
    </button>

    <section class="panel">
      <div id="log" class="log" aria-live="polite"></div>
      <form id="form" class="composer">
        <input id="input" autocomplete="off" placeholder="Сообщение" enterkeyhint="send" aria-label="Сообщение" />
        <button type="submit">Отправить</button>
      </form>
    </section>
  </main>

  <script src="agent/intent.js"></script>
  <script src="app.js"></script>
</body>
</html>
